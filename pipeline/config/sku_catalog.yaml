# Sonalika implement SKU catalogue.
# Structure derived from Wireframe.xlsx sheets "Agri Lifecycle" (category taxonomy) and
# "Application" (HP band, farm-size suitability, mechanisation maturity).
# hp_min/hp_max gate which slice of the village tractor base is addressable (Phase 7).
# crop_fit weights map the village crop-mix vector onto implement relevance.
# season lists the months (1-12) of peak demand, from the "Seasonality" sheet; these are
# priors only -- UCM-estimated gamma_t overrides them where the series supports it.

meta:
  source_sheets: [Agri Lifecycle, Application, Seasonality]
  currency: INR
  notes: >
    Prices are indicative market ranges used for value-weighting the demand potential,
    not Sonalika list prices. life_years drives the replacement-demand echo.

categories:
  tillage:        {label: "Tillage & land preparation", order: 1}
  sowing:         {label: "Sowing / planting / transplanting", order: 2}
  crop_protection: {label: "Crop protection & fertilisation", order: 3}
  irrigation:     {label: "Irrigation-related", order: 4}
  harvesting:     {label: "Harvesting", order: 5}
  residue:        {label: "Residue management", order: 6}
  post_harvest:   {label: "Post-harvest", order: 7}
  haulage:        {label: "Haulage", order: 8}
  precision:      {label: "Precision / digital / autonomous", order: 9}

